name: Build Original UI APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Build Webview Android App
        run: |
          flutter create webapp --org=com.himalyan --project-name=himalyan_hydrogreens
          cd webapp
          flutter pub add webview_flutter
          
          mkdir -p assets
          cp ../index.html assets/index.html
          [ -d ../css ] && cp -r ../css assets/ || true
          [ -d ../js ] && cp -r ../js assets/ || true

          sed -i '/flutter:/a \  assets:\n    - assets/\n    - assets/index.html' pubspec.yaml

          cat << 'EOF' > lib/main.dart
          import 'package:flutter/material.dart';
          import 'package:webview_flutter/webview_flutter.dart';

          void main() {
            WidgetsFlutterBinding.ensureInitialized();
            runApp(const MaterialApp(
              debugShowCheckedModeBanner: false,
              home: FarmOriginalApp(),
            ));
          }

          class FarmOriginalApp extends StatefulWidget {
            const FarmOriginalApp({super.key});
            @override
            State<FarmOriginalApp> createState() => _FarmOriginalAppState();
          }

          class _FarmOriginalAppState extends State<FarmOriginalApp> {
            late final WebViewController _controller;

            @override
            void initState() {
              super.initState();
              _controller = WebViewController()
                ..setJavaScriptMode(JavaScriptMode.unrestricted)
                ..loadFlutterAsset('assets/index.html');
            }

            @override
            Widget build(BuildContext context) {
              return PopScope(
                canPop: false,
                onPopInvokedWithResult: (didPop, result) async {
                  if (await _controller.canGoBack()) {
                    _controller.goBack();
                  }
                },
                child: Scaffold(
                  body: SafeArea(
                    child: WebViewWidget(controller: _controller),
                  ),
                ),
              );
            }
          }
          EOF

          flutter build apk --release --no-tree-shake-icons
          cp build/app/outputs/flutter-apk/app-release.apk ../app-release.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: himalyan-hydrogreens-app
          path: app-release.apk
