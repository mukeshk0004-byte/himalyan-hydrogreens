name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Setup complete Flutter Android Project
        run: |
          mkdir build_dir
          cd build_dir
          flutter create himalyan_hydrogreens --org=com.himalyan
          cd himalyan_hydrogreens
          cp ../../lib/main.dart lib/main.dart
          flutter pub add intl
          flutter build apk --release --no-tree-shake-icons
          cp build/app/outputs/flutter-apk/app-release.apk ../../app-release.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: himalyan-hydrogreens-app
          path: app-release.apk
